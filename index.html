<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: PNG zuerst (schriftunabhängig gerastert – das SVG nutzt die
         Archivo-Wortmarke, die im Favicon-Kontext nicht geladen wird) -->
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Seitenspezifische Tags (title, description, canonical, hreflang,
         og:url/title/description, twitter:title/description, JSON-LD) setzt
         jede Seite über <Seo> (src/Seo.jsx) – beim Build landen sie im
         vorgerenderten HTML der jeweiligen Route. Hier NICHT wiederholen,
         sonst stehen sie doppelt im statischen HTML.

         Die absolute Domain kommt aus VITE_SITE_URL (.env). -->

    <!-- Open Graph / Social Sharing – seitenübergreifend -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Valanto" />
    <meta property="og:locale" content="de_CH" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Valanto – Bewerten, vermarkten, verwalten in einem Werkzeug." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
